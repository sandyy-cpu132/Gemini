name: Build Android APK

on:
  workflow_dispatch: # Allows you to manually trigger builds from the GitHub website/app
  push:
    branches:
      - main

jobs:
  build:
    name: Compile Android Build
    runs-on: ubuntu-latest

    steps:
      - name: 🛑 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: ⚙️ Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # Optional for cloud builds, required if linking to your Expo account

      - name: 📥 Install Dependencies
        run: npm install

      - name: 🔨 Build Android APK (Local/EAS Hybrid)
        run: npx eas-cli build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
